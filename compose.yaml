services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pdm
      POSTGRES_USER: pdm
      POSTGRES_PASSWORD: pdm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdm -d pdm"]
      interval: 5s
      timeout: 5s
      retries: 20

  pdm:
    build:
      context: .
      dockerfile: docker/Dockerfile.standalone
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PDM_DATABASE_URL: postgresql://pdm:pdm@postgres:5432/pdm
      PDM_STORAGE_LOCAL: /var/lib/pdm/blobs
      PDM_CLI_UPDATE: "0"
      PDM_WEB_UPDATE: "0"
    ports:
      - "${PDM_PORT:-8080}:8080"
    volumes:
      - blob-data:/var/lib/pdm/blobs

volumes:
  postgres-data:
  blob-data:
